name: Browser2 Local AUTH-GAME CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # Daily UTC; offline-only checks

permissions:
  contents: read

concurrency:
  group: browser2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure proprietary assets or private databases were not committed
        shell: bash
        run: |
          python3 - <<'PY2'
          import subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          forbidden_ext={'.glb','.ktx2','.wasm','.pak','.sqlite3','.db','.har','.pcap','.p12','.pfx','.pem'}
          forbidden_root=('public_assets/','YEREL_SUNUCU/','RAPORLAR/','LOGS/')
          bad=[p for p in paths if p.startswith(forbidden_root) or any(p.lower().endswith(x) for x in forbidden_ext)]
          if bad: raise SystemExit('Private or proprietary files in public repository: '+str(bad))
          print('OK: only selected public-safe development files')
          PY2
      - name: Check Python syntax
        run: python -m compileall -q server
      - name: V89 original V28 v2 templateId and locked shop tests
        run: python -m unittest discover -s server -p 'test_shop_template_v89.py' -v
      - name: V88 original V28 shopdialog protocol and no-buy regression
        run: python -m unittest discover -s server -p 'test_original_shop_v88.py' -v
      - name: V87 native item_proto name lookup, wiki source separation and quest text tests
        run: python -m unittest discover -s server -p 'test_native_npc_ui_v87.py' -v
      - name: V86 authenticated NPC in-game SQL preview and source patch tests
        run: python -m unittest discover -s server -p 'test_native_npc_ui_v86.py' -v
      - name: V85 exact NPC NameError fix regression (synthetic source only)
        run: python -m unittest discover -s server -p 'test_fix_native_shop_callback_v85.py' -v
      - name: V79 native NPC shop wire offline regression (synthetic data only)
        run: |
          python server/native_shop_wire_v79.py
          python -m unittest discover -s server -p 'test_native_shop_wire_v79.py' -v
      - name: V14 AUTH + WebSocket selftest
        run: python server/browser2_local_base_v14.py --selftest
      - name: V15 boot manifest selftest
        run: python server/browser2_local_stack_v15.py --selftest
      - name: V16 map overlay / HTTP Range selftest
        run: python server/browser2_local_map_sync_v16.py --selftest
      - name: V17 trace selftest
        run: python server/browser2_gercek_oyun_tani_v17.py selftest
      - name: V18 auth-aligned launcher selftest
        run: python server/browser2_baglanti_duzeltme_v18.py selftest
      - name: V19 safe HTTP 401/404 route diagnostic selftest
        run: python server/browser2_http_route_audit_v19.py selftest
      - name: V20 read-only browser bootstrap observer selftest
        run: python server/browser2_client_boot_probe_v20.py selftest
      - name: V21 original locale overlay selftest
        run: python server/browser2_local_locale_sync_v21.py selftest
      - name: V22 bounded world asset overlay / original priority selftest
        run: python server/browser2_public_world_asset_sync_v22.py selftest
      - name: V23 native spawn and first-village map provenance selftest
        run: python server/browser2_spawn_audit_v23.py selftest
      - name: V24 original map geometry metadata selftest
        run: python server/browser2_map_geometry_audit_v24.py selftest
      - name: V24 public original map metadata inspection (optional)
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: python server/browser2_map_geometry_audit_v24.py fetch-public
      - name: V25 isolated first village QA (no original DB changes) selftest
        run: python server/browser2_yongan_isolated_qa_v25.py selftest
      - name: V24 non-mutating first-village preview selftest
        run: python server/browser2_village_preview_v24.py selftest
      - name: V26 V28 archive discovery and local website snapshots selftest
        run: python server/browser2_v28_local_site_v26.py selftest
      - name: Termux launchers bash syntax check
        run: bash -n termux/*.sh
      - name: V27 read-only original pack routes and safe 404 diagnostic selftest
        run: python server/browser2_v28_pack_compat_v27.py selftest
      - name: V29 isolated original A1 village visual QA selftest
        run: python server/browser2_v29_isolated_village_qa.py selftest
      - name: V30 A1 genuine WebP transport and offline terrain QA selftest
        run: python server/browser2_v30_terrain_asset_qa.py selftest
      - name: Build Termux update package
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          mkdir -p dist/TESTLER
          cp server/*.py dist/TESTLER/
          cp termux/update_phone.sh dist/UPDATE_BROWSER2_FROM_GITHUB.sh
          cd dist
          zip -r -q ../browser2-termux-update.zip TESTLER UPDATE_BROWSER2_FROM_GITHUB.sh
      - name: Upload Termux update artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: browser2-termux-update
          path: browser2-termux-update.zip
          retention-days: 7
